name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build
      run: npm run build

    - name: Prepare extension package
      run: |
        # uiディレクトリが存在しない場合は作成
        mkdir -p dist/ui
        mkdir -p dist/assets

        # 静的ファイルをコピー
        cp manifest.json dist/
        # uiフォルダ内のhtmlファイルをコピー（存在する場合）
        if ls src/ui/*.html 1> /dev/null 2>&1; then
          cp src/ui/*.html dist/ui/
        fi
        # assetsフォルダ内のファイルをコピー（存在する場合）
        if [ -d "src/assets" ]; then
          cp -r src/assets/* dist/assets/
        fi

        # manifest.jsonのパスと拡張子を修正
        # "src/..." -> "..." (dist直下になるため)
        sed -i 's|"src/|"|g' dist/manifest.json
        # ".ts" -> ".js" (トランスパイル後のファイルを参照するため)
        sed -i 's|\.ts"|\.js"|g' dist/manifest.json

    - name: Zip extension
      run: |
        cd dist
        zip -r ../extension.zip ./*

    - name: Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: extension.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
